<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Samsung Forced Dark</title>
		<style>
			* {
				box-sizing: border-box;
			}

			body {
				max-width: 560px;
				margin: 0 auto;
				padding: 16px;
				background: #ffffff;
				color: #1f2328;
				font: 16px/1.5 system-ui, sans-serif;
			}

			.panel {
				position: sticky;
				top: 8px;
				z-index: 1;
				display: flex;
				flex-wrap: wrap;
				gap: 8px 12px;
				align-items: center;
				margin-bottom: 20px;
				padding: 10px 12px;
				border-radius: 8px;
				background: #0d1117;
				color: #e6edf3;
			}

			.panel output {
				flex: 1 1 220px;
				font-size: 14px;
			}

			.panel button {
				min-height: 44px;
				padding: 0 14px;
				border: 1px solid #3d444d;
				border-radius: 6px;
				background: #21262d;
				color: #e6edf3;
				font: inherit;
				cursor: pointer;
			}

			.hero {
				padding: 20px;
				border-radius: 10px;
				background: linear-gradient(120deg, #ff8a3d, #ffd23f);
				color: #2b1600;
			}

			.hero h1 {
				margin: 0;
				font-size: 24px;
			}

			.card {
				margin: 16px 0;
				padding: 14px;
				border: 1px solid #d0d7de;
				border-radius: 10px;
				background: #f6f8fa;
				box-shadow: 0 2px 6px rgba(31, 35, 40, 0.18);
			}

			.badge::before {
				content: '인기';
				padding: 2px 8px;
				border-radius: 999px;
				background: #ffe3d6;
				color: #c2410c;
				font-size: 12px;
			}

			.modern {
				color: oklch(0.45 0.16 260);
			}

			.row {
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
				align-items: center;
			}

			.chip {
				width: 16px;
				height: 16px;
				background: #808080;
			}

			.box {
				width: 64px;
				height: 40px;
				background: #808080;
			}

			.pattern {
				height: 56px;
				margin: 16px 0;
				border-radius: 8px;
				background-size: 28px 28px;
			}

			input {
				display: block;
				width: 100%;
				min-height: 44px;
				margin: 12px 0;
				padding: 0 10px;
				border: 1px solid #d0d7de;
				border-radius: 8px;
				background: #ffffff;
				color: #1f2328;
				font: inherit;
			}

			input::placeholder {
				color: #6e7781;
			}

			.cta {
				width: 100%;
				min-height: 48px;
				border: 0;
				border-radius: 8px;
				background: #fee500;
				color: #191600;
				font: 700 16px system-ui, sans-serif;
			}

			img,
			canvas {
				display: block;
				max-width: 100%;
				margin: 16px 0;
				border-radius: 8px;
			}
		</style>
	</head>
	<body>
		<div class="panel" data-sfd-ignore>
			<output id="status">검사 중…</output>
			<button type="button" id="toggle">삼성처럼 보기</button>
		</div>

		<section class="hero">
			<h1>오늘 아침에 구운 빵</h1>
			<p>오전 7시부터 나옵니다</p>
		</section>

		<article class="card">
			<span class="badge" id="badge"></span>
			<h2>우유 식빵</h2>
			<p class="modern" id="modern">oklch로 지정한 글자색입니다.</p>
			<div class="row">
				<svg id="icon" width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="주황색 원">
					<circle cx="20" cy="20" r="18" fill="#ff5714" />
				</svg>
				<div class="chip" id="chip" title="20px 이하"></div>
				<div class="box" id="box" title="20px 초과"></div>
			</div>
		</article>

		<div class="pattern" id="pattern"></div>
		<input id="field" placeholder="요청 사항을 적어 주세요" />
		<button class="cta" id="cta" type="button">바로 주문하기</button>
		<img id="photo" width="320" height="120" alt="그라디언트 표본 이미지" />
		<canvas id="chart" width="320" height="80" aria-label="변환되지 않는 canvas 표본"></canvas>
		<div id="later"></div>

		<script src="/dist/detect.global.js"></script>
		<script src="/dist/emulate.global.js"></script>
		<script>
			const paint = (width, height, draw) => {
				const canvas = document.createElement('canvas');
				canvas.width = width;
				canvas.height = height;
				draw(canvas.getContext('2d'));
				return canvas.toDataURL('image/png');
			};

			document.getElementById('photo').src = paint(320, 120, (ctx) => {
				const fill = ctx.createLinearGradient(0, 0, 320, 0);
				fill.addColorStop(0, '#ffffff');
				fill.addColorStop(1, '#ff5714');
				ctx.fillStyle = fill;
				ctx.fillRect(0, 0, 320, 120);
			});

			const tile = paint(28, 28, (ctx) => {
				ctx.fillStyle = '#ffffff';
				ctx.fillRect(0, 0, 28, 28);
				ctx.fillStyle = '#1a73e8';
				ctx.fillRect(0, 0, 14, 14);
			});
			document.getElementById('pattern').style.backgroundImage = `url(${tile})`;

			const chart = document.getElementById('chart').getContext('2d');
			chart.fillStyle = '#ffffff';
			chart.fillRect(0, 0, 320, 80);
			chart.fillStyle = '#ff5714';
			chart.fillRect(20, 20, 280, 40);

			const status = document.getElementById('status');
			const toggle = document.getElementById('toggle');
			const LABELS = {
				forced: '삼성 인터넷 강제 다크가 켜져 있습니다',
				'not-forced': '삼성 인터넷이지만 강제 다크는 꺼져 있습니다',
				'not-samsung': '삼성 인터넷이 아닙니다',
				unknown: '삼성 인터넷이지만 상태를 읽지 못했습니다',
			};

			let emulation = null;
			SamsungForcedDarkDetect.detectForcedDark().then((result) => {
				const sample = result.sample === null ? '' : ` (흰색 SVG 값 ${result.sample})`;
				status.textContent = LABELS[result.state] + sample;
				// A real forced dark page must not be converted a second time.
				toggle.hidden = result.forced;
			});

			toggle.addEventListener('click', () => {
				if (emulation) {
					emulation.stop();
					emulation = null;
				} else {
					emulation = SamsungForcedDarkEmulate.emulateForcedDark();
				}
				toggle.textContent = emulation ? '원래대로 보기' : '삼성처럼 보기';
			});
		</script>
	</body>
</html>
